[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmc"
version = "1.0.0"
description = "BMC tile analysis and tile umbrella workflows"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "mdtraj",
  "gemmi",
  "pymbar",
  "mdsim @ git+https://github.com/feiglab/mdsim.git",
  "cocomo @ git+https://github.com/feiglab/cocomo.git",
]

[project.scripts]
tileumbrella = "bmc.cli.tileumbrella:main"
tileumbrella_analysis = "bmc.cli.tileumbrella_analysis:main"
prep_tileumbrella = "bmc.cli.prep_tileumbrella:main"
equi_tileumbrella = "bmc.cli.equi_tileumbrella:main"
initbias_tileumbrella = "bmc.cli.initbias_tileumbrella:main"
calc_comp_cocomo = "bmc.cli.calc_comp_cocomo:main"
assembly = "bmc.cli.assembly:main"
prep_assembly = "bmc.cli.prep_assembly:main"

[tool.setuptools]
package-dir = {"" = "src"}
script-files = [
  "scripts/check_tileumbrella_jobs.sh",
  "scripts/combine_tileumbrella.sh",
  "scripts/run_tileumbrella.sh",
  "scripts/setup_tileumbrella_jobs.sh",
  "scripts/submit_tileumbrella_jobs.sh",
  "scripts/job.tileumbrella.slurm.template",
  "scripts/check_assembly_jobs.sh",
  "scripts/run_assembly.sh",
  "scripts/setup_assembly_job.sh",
  "scripts/job.assembly.slurm.template",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E","F","I","UP"]
ignore = ["UP007", "UP045", "E501"]
